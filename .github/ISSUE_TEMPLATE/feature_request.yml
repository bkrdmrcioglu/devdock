name: Feature request
description: Suggest an idea, a new framework to detect, or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd imagine it working, if you have something in mind
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
